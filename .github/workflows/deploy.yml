name: Build and Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 -t mayffi/monitoring-lab-app:latest ./app
          docker push mayffi/monitoring-lab-app:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Restart deployment to pull new image
        run: kubectl rollout restart deployment/monitoring-lab-app

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/monitoring-lab-app --timeout=60s
